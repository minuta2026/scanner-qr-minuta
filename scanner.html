<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>Escanear QR</title>

<script
    src="https://unpkg.com/html5-qrcode">
</script>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        padding: 20px;

        background: #f4f6f8;

        font-family: Arial, sans-serif;

        text-align: center;

    }


    h2 {

        margin-top: 10px;

        color: #0b3d91;

    }


    /* ================================
       SELECTOR DE CÁMARA
    ================================= */

    #contenedorCamara {

        width: 100%;

        max-width: 500px;

        margin: 15px auto;

        text-align: left;

    }


    #contenedorCamara label {

        display: block;

        margin-bottom: 6px;

        font-weight: bold;

        color: #333;

    }


    #selectorCamara {

        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 8px;

        background: white;

        font-size: 15px;

        cursor: pointer;

    }


    /* ================================
       INFORMACIÓN DE CÁMARA
    ================================= */

    #camaraActual {

        margin-top: 10px;

        padding: 10px;

        background: #e8f0fe;

        border-radius: 8px;

        color: #0b3d91;

        font-size: 14px;

        text-align: center;

    }


    /* ================================
       LECTOR QR
    ================================= */

    #lectorQR {

        width: 100%;

        max-width: 500px;

        margin: 20px auto;

        background: white;

        border-radius: 12px;

        overflow: hidden;

    }


    /* ================================
       MENSAJE
    ================================= */

    #mensajeQR {

        margin-top: 15px;

        font-size: 16px;

        color: #555;

    }


    /* ================================
       CONTROLES DE ENFOQUE
    ================================= */

    .controlesEnfoque {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
    }

    .controlesEnfoque button {
        border: none;
        border-radius: 8px;
        padding: 9px 14px;
        background: #1769d1;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }

    .controlesEnfoque button:active {
        transform: scale(0.97);
    }

    @media (max-width: 600px) {
        .controlesEnfoque button {
            padding: 8px 12px;
            font-size: 13px;
        }
    }


    /* ================================
       BOTÓN CERRAR
    ================================= */

    .cerrar {

        margin-top: 15px;

        padding: 12px 25px;

        border: none;

        border-radius: 8px;

        background: #d32f2f;

        color: white;

        font-size: 16px;

        cursor: pointer;

    }


    .cerrar:hover {

        opacity: 0.9;

    }


    /* ================================
       BOTÓN CAMBIAR
    ================================= */

    #botonCambiar {

        margin-top: 10px;

        padding: 10px 20px;

        border: none;

        border-radius: 8px;

        background: #0b3d91;

        color: white;

        font-size: 15px;

        cursor: pointer;

        display: none;

    }


    #botonCambiar:hover {

        opacity: 0.9;

    }



    /* =====================================================
       VIDEO DE LA CÁMARA
    ===================================================== */

    #lectorQR video {
        width: 100% !important;
        height: auto !important;
        max-height: 70vh;
        object-fit: cover;
        display: block;
    }

    @media (max-width: 600px) {

        body {
            padding: 12px;
        }

        h2 {
            font-size: 21px;
        }

        #lectorQR {
            margin: 15px auto;
            border-radius: 12px;
        }

        #selectorCamara {
            font-size: 14px;
            padding: 10px;
        }

        #camaraActual {
            font-size: 13px;
        }

        #mensajeQR {
            font-size: 14px;
        }

        .cerrar {
            width: 100%;
            max-width: 300px;
        }
    }

</style>


</head>

<body>


<h2>📷 Escanear código QR</h2>


<!-- =================================
     SELECTOR DE CÁMARA
================================== -->

<div id="contenedorCamara">

    <label for="selectorCamara">

        📷 Seleccionar cámara

    </label>


    <select
        id="selectorCamara"
        disabled>

        <option>

            Detectando cámaras...

        </option>

    </select>


    <div id="camaraActual">

        📷 Cámara: Detectando...

    </div>

</div>


<!-- =================================
     LECTOR
================================== -->

<div id="lectorQR"></div>


<!-- =================================
     MENSAJE
================================== -->

<div id="mensajeQR">

    Preparando cámara...

</div>


<!-- =================================
     BOTÓN CANCELAR
================================== -->

<button
    type="button"
    class="cerrar"
    onclick="cerrarScanner()">

    ❌ Cancelar

</button>


<script>


    /* =====================================================
       VARIABLES
    ===================================================== */

    let scannerQR = null;

    let QRProcesado = false;

    let camarasDisponibles = [];

    let camaraActualId = null;


    /* =====================================================
       OBTENER CÁMARAS
    ===================================================== */

    async function obtenerCamaras() {

        try {

            if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
            ) {
                throw new Error(
                    "El navegador no permite acceder a la cámara."
                );
            }

            /*
             * Primero solicitamos permiso.
             *
             * Esto es importante porque algunos navegadores
             * no muestran los nombres de las cámaras antes
             * de conceder permiso.
             */

            const stream =
                await navigator.mediaDevices.getUserMedia({

                    video: true

                });


            /*
             * Cerramos inmediatamente el stream.
             *
             * El lector html5-qrcode abrirá después
             * la cámara que nosotros seleccionemos.
             */

            stream.getTracks().forEach(function(track) {

                track.stop();

            });


            /*
             * Obtenemos todas las cámaras.
             */

            const dispositivos =
                await Html5Qrcode.getCameras();


            if (
                !dispositivos ||
                dispositivos.length === 0
            ) {

                throw new Error(
                    "No se encontraron cámaras."
                );

            }


            camarasDisponibles =
                dispositivos;


            const selector =
                document.getElementById(
                    "selectorCamara"
                );


            /*
             * Limpiar selector.
             */

            selector.innerHTML = "";


            /*
             * Agregar cada cámara.
             */

            dispositivos.forEach(
                function(camara, indice) {

                    const opcion =
                        document.createElement(
                            "option"
                        );


                    opcion.value =
                        camara.id;


                    /*
                     * Algunos dispositivos
                     * entregan nombre.
                     *
                     * Otros pueden devolver
                     * solamente "Camera 1",
                     * etc.
                     */

                    let nombre =
                        camara.label;


                    if (
                        !nombre ||
                        nombre.trim() === ""
                    ) {

                        nombre =
                            "Cámara " +
                            (indice + 1);

                    }


                    opcion.textContent =
                        "📷 " + nombre;


                    selector.appendChild(
                        opcion
                    );

                }
            );


            selector.disabled = false;


            /*
             * Intentamos seleccionar
             * inicialmente una cámara trasera.
             */

            let indiceTrasera = -1;


            dispositivos.forEach(
                function(camara, indice) {

                    const nombre =
                        (
                            camara.label ||
                            ""
                        ).toLowerCase();


                    if (
                        indiceTrasera === -1 &&
                        (
                            nombre.includes(
                                "back"
                            ) ||
                            nombre.includes(
                                "rear"
                            ) ||
                            nombre.includes(
                                "trasera"
                            ) ||
                            nombre.includes(
                                "environment"
                            )
                        )
                    ) {

                        indiceTrasera =
                            indice;

                    }

                }
            );


            /*
             * Si encontramos cámara trasera,
             * la usamos.
             *
             * Si no, utilizamos la primera.
             */

            if (indiceTrasera >= 0) {

                camaraActualId =
                    dispositivos[
                        indiceTrasera
                    ].id;

            } else {

                camaraActualId =
                    dispositivos[0].id;

            }


            selector.value =
                camaraActualId;


            actualizarNombreCamara();


            /*
             * Iniciar cámara.
             */

            iniciarScanner();


        }

        catch (error) {

            console.error(
                "Error obteniendo cámaras:",
                error
            );


            document.getElementById(
                "mensajeQR"
            ).innerHTML =
                "❌ No se pudieron obtener las cámaras. " +
                "Verifique que haya concedido permiso para utilizar la cámara.";

        }

    }


    /* =====================================================
       MOSTRAR CÁMARA ACTUAL
    ===================================================== */

    function actualizarNombreCamara() {

        const elemento =
            document.getElementById(
                "camaraActual"
            );


        const camara =
            camarasDisponibles.find(
                function(c) {

                    return (
                        c.id ===
                        camaraActualId
                    );

                }
            );


        if (!camara) {

            elemento.innerHTML =
                "📷 Cámara: No identificada";

            return;

        }


        let nombre =
            camara.label;


        if (
            !nombre ||
            nombre.trim() === ""
        ) {

            nombre =
                "Cámara seleccionada";

        }


        elemento.innerHTML =
            "📷 <strong>Cámara utilizada:</strong> " +
            nombre;

    }


    /* =====================================================
       INICIAR SCANNER
    ===================================================== */

    /* =====================================================
       ENFOQUE DE CÁMARA — MODO CERCANO
       ===================================================== */

    let intervaloEnfoque = null;

    async function obtenerTrackCamara() {

        const video = document.querySelector("#lectorQR video");

        if (!video || !video.srcObject) return null;

        const tracks = video.srcObject.getVideoTracks();

        if (!tracks || !tracks.length) return null;

        return tracks[0];
    }

    async function enfoqueCercano() {

        try {

            const track = await obtenerTrackCamara();

            if (!track || !track.applyConstraints) {
                console.warn("El navegador no permite controlar el enfoque.");
                return;
            }

            const capabilities = track.getCapabilities
                ? track.getCapabilities()
                : {};

            console.log("📷 Capacidades:", capabilities);

            const modos = Array.isArray(capabilities.focusMode)
                ? capabilities.focusMode
                : [];

            /*
             * Si el teléfono permite enfoque manual y focusDistance,
             * usamos el valor MÁS CERCANO posible.
             *
             * IMPORTANTE:
             * focusDistance está expresado en metros.
             * Un valor menor = objeto más cerca.
             */
            if (
                capabilities.focusDistance &&
                typeof capabilities.focusDistance.min === "number" &&
                typeof capabilities.focusDistance.max === "number"
            ) {

                const min = capabilities.focusDistance.min;
                const max = capabilities.focusDistance.max;

                /*
                 * No usamos el 20% del rango como antes.
                 * Eso podía mandar el foco demasiado lejos.
                 *
                 * Probamos una distancia muy cercana, pero no exactamente
                 * el mínimo absoluto para evitar que el QR quede demasiado
                 * cerca de la distancia mínima de enfoque de la lente.
                 */
                const distanciaCercana =
                    min + ((max - min) * 0.03);

                if (modos.includes("manual")) {

                    try {

                        await track.applyConstraints({
                            advanced: [{
                                focusMode: "manual",
                                focusDistance: distanciaCercana
                            }]
                        });

                        console.log(
                            "✅ Enfoque manual cercano:",
                            distanciaCercana
                        );

                        return;
                    } catch (e) {
                        console.warn(
                            "No funcionó enfoque manual:",
                            e
                        );
                    }
                }

                /*
                 * Algunos equipos aceptan focusDistance sin manual.
                 */
                try {

                    await track.applyConstraints({
                        advanced: [{
                            focusDistance: distanciaCercana
                        }]
                    });

                    console.log(
                        "✅ Distancia de enfoque cercana:",
                        distanciaCercana
                    );

                    return;

                } catch (e) {
                    console.warn(
                        "No se pudo aplicar focusDistance:",
                        e
                    );
                }
            }

            /*
             * Si no existe control de distancia, usamos autofocus continuo.
             */
            if (modos.includes("continuous")) {

                try {

                    await track.applyConstraints({
                        advanced: [{
                            focusMode: "continuous"
                        }]
                    });

                    console.log("✅ Autofocus continuo activado.");

                } catch (e) {
                    console.warn(
                        "No se pudo activar autofocus continuo:",
                        e
                    );
                }
            }

        } catch (error) {

            console.warn(
                "Error configurando enfoque cercano:",
                error
            );
        }
    }


    async function enfoqueAutomatico() {

        try {

            const track = await obtenerTrackCamara();

            if (!track || !track.applyConstraints) return;

            const capabilities = track.getCapabilities
                ? track.getCapabilities()
                : {};

            const modos = Array.isArray(capabilities.focusMode)
                ? capabilities.focusMode
                : [];

            if (modos.includes("continuous")) {

                await track.applyConstraints({
                    advanced: [{
                        focusMode: "continuous"
                    }]
                });

                console.log("🔄 Autofocus continuo.");

            }

        } catch (error) {

            console.warn(
                "No se pudo activar autofocus:",
                error
            );
        }
    }


    async function activarEnfoqueContinuo() {

        if (intervaloEnfoque) {
            clearInterval(intervaloEnfoque);
            intervaloEnfoque = null;
        }

        /*
         * Primero intentamos enfoque cercano.
         */
        await enfoqueCercano();

        /*
         * Volvemos a intentarlo unas veces porque algunos teléfonos
         * tardan en terminar de inicializar la cámara.
         */
        let intentos = 0;

        intervaloEnfoque = setInterval(async function() {

            intentos++;

            await enfoqueCercano();

            if (intentos >= 8) {

                clearInterval(intervaloEnfoque);
                intervaloEnfoque = null;

                console.log(
                    "✅ Finalizaron los intentos automáticos de enfoque."
                );
            }

        }, 700);
    }


    function detenerRutinaEnfoque() {

        if (intervaloEnfoque) {

            clearInterval(intervaloEnfoque);
            intervaloEnfoque = null;
        }
    }

    /* =====================================================
       INICIAR SCANNER
       ===================================================== */

    async function iniciarScanner() {

        if (!camaraActualId) {
            console.error("No hay cámara seleccionada.");
            return;
        }

        detenerRutinaEnfoque();

        /*
         * Detener completamente el lector anterior.
         */
        if (scannerQR) {
            try {
                await scannerQR.stop();
            } catch (error) {
                console.warn("No se pudo detener el lector anterior:", error);
            }

            scannerQR = null;
        }

        QRProcesado = false;

        const lector = document.getElementById("lectorQR");
        lector.innerHTML = "";

        scannerQR = new Html5Qrcode("lectorQR");

        try {

            await scannerQR.start(

                camaraActualId,

                {
                    fps: 15,

                    qrbox: function(viewfinderWidth, viewfinderHeight) {

                        /*
                         * QR grande para permitir lectura a corta distancia.
                         */
                        const size = Math.floor(
                            Math.min(
                                viewfinderWidth,
                                viewfinderHeight
                            ) * 0.78
                        );

                        return {
                            width: Math.min(size, 340),
                            height: Math.min(size, 340)
                        };
                    },

                    aspectRatio: 1.0,
                    disableFlip: false
                },

                function(textoQR) {

                    if (QRProcesado) {
                        return;
                    }

                    QRProcesado = true;
                    detenerRutinaEnfoque();

                    document.getElementById("mensajeQR").innerHTML =
                        "✅ QR detectado. Procesando...";

                    if (scannerQR) {

                        scannerQR.stop()
                            .then(function() {
                                scannerQR = null;
                                enviarQR(textoQR);
                            })
                            .catch(function(error) {
                                console.warn(
                                    "Error deteniendo cámara después del QR:",
                                    error
                                );

                                scannerQR = null;
                                enviarQR(textoQR);
                            });

                    } else {
                        enviarQR(textoQR);
                    }
                },

                function(errorMessage) {
                    /*
                     * Los errores de búsqueda son normales mientras
                     * el usuario todavía no apunta al QR.
                     */
                }
            );

            /*
             * Esperar a que el <video> exista realmente.
             */
            await new Promise(function(resolve) {
                setTimeout(resolve, 500);
            });

            const video = document.querySelector("#lectorQR video");

            if (video) {
                video.setAttribute("autoplay", "");
                video.setAttribute("playsinline", "");
                video.setAttribute("muted", "");
                video.setAttribute("webkit-playsinline", "");

                try {
                    await video.play();
                } catch (error) {
                    console.warn("El video no pudo iniciar automáticamente:", error);
                }
            }

            /*
             * Activar la rutina reforzada de enfoque.
             */
            await activarEnfoqueContinuo();

            actualizarNombreCamara();

            document.getElementById("mensajeQR").innerHTML =
                "📷 Cámara lista. Acerca el QR y mantenlo dentro del marco";

        } catch (error) {

            console.error("Error iniciando cámara:", error);

            detenerRutinaEnfoque();
            scannerQR = null;

            document.getElementById("mensajeQR").innerHTML =
                "❌ No se pudo iniciar esta cámara.";
        }
    }


    /* =====================================================
       CAMBIAR DE CÁMARA
    ===================================================== */

    async function cambiarCamara() {

        detenerRutinaEnfoque();

        const selector =
            document.getElementById(
                "selectorCamara"
            );

        const nuevoId =
            selector.value;

        if (!nuevoId) {
            return;
        }

        if (nuevoId === camaraActualId) {
            return;
        }

        document.getElementById(
            "mensajeQR"
        ).innerHTML =
            "🔄 Cambiando de cámara...";

        QRProcesado = true;

        /*
         * Detener completamente la cámara actual.
         */
        if (scannerQR) {

            try {
                await scannerQR.stop();
            } catch (error) {
                console.warn(
                    "No se pudo detener correctamente la cámara:",
                    error
                );
            }

            scannerQR = null;
        }

        /*
         * Limpiar el video anterior.
         */
        document.getElementById(
            "lectorQR"
        ).innerHTML = "";

        /*
         * Seleccionar la nueva cámara.
         */
        camaraActualId = nuevoId;

        actualizarNombreCamara();

        /*
         * Dar un pequeño tiempo al navegador/celular
         * para liberar la cámara anterior.
         */
        await new Promise(function(resolve) {
            setTimeout(resolve, 350);
        });

        QRProcesado = false;

        /*
         * Iniciar la nueva cámara.
         */
        await iniciarScanner();
    }


    /* =====================================================
       ENVIAR QR A APP SCRIPT
    ===================================================== */

    function enviarQR(textoQR) {


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const origen =
            parametros.get("origen") ||
            "inicio";


        /*
         * Verificar ventana que abrió
         * el escáner.
         */

        if (
            window.opener &&
            !window.opener.closed
        ) {


            window.opener.postMessage(

                {

                    tipo:
                        "QR_ESCANEADO",

                    texto:
                        textoQR,

                    origen:
                        origen

                },

                "*"

            );


            /*
             * Cerrar lector.
             */

            setTimeout(

                function() {

                    window.close();

                },

                300

            );


        }

        else {


            document.getElementById(
                "mensajeQR"
            ).innerHTML =

                "⚠️ No se encontró la aplicación " +
                "que abrió este lector.";

        }

    }


    /* =====================================================
       CERRAR SCANNER
    ===================================================== */

    async function cerrarScanner() {


        if (scannerQR) {


            try {

                await scannerQR.stop();

            }

            catch (error) {

                console.warn(
                    "Error cerrando cámara:",
                    error
                );

            }


            scannerQR = null;


        }


        window.close();

    }


    /* =====================================================
       CAMBIO DEL SELECTOR
    ===================================================== */

    document.getElementById(
        "selectorCamara"
    ).addEventListener(

        "change",

        async function() {

            await cambiarCamara();

        }

    );


    /* =====================================================
       INICIAR AL CARGAR
    ===================================================== */

    window.addEventListener(

        "load",

        function() {

            obtenerCamaras();

        }

    );


</script>

</body>

</html>
