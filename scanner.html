<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Escanear QR</title>

    <script
        src="https://unpkg.com/html5-qrcode">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin-top: 10px;
            color: #0b3d91;
        }

        #lectorQR {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        #mensajeQR {
            margin-top: 15px;
            font-size: 16px;
            color: #555;
        }

        .opcionesQR {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .usar-camara,
        .cargar-imagen,
        .cerrar {
            width: 220px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .usar-camara {
            background: #0b3d91;
        }

        .cargar-imagen {
            background: #2e7d32;
        }

        .cerrar {
            background: #d32f2f;
        }

        .usar-camara:hover,
        .cargar-imagen:hover,
        .cerrar:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

    <h2>📷 Escanear código QR</h2>

    <div id="lectorQR"></div>

    <div id="mensajeQR">
        Seleccione una opción para continuar.
    </div>

    <div class="opcionesQR">

        <button
            type="button"
            class="usar-camara"
            onclick="iniciarScanner()">
            📷 Usar cámara
        </button>

        <input
            type="file"
            id="archivoQR"
            accept="image/*"
            style="display:none"
            onchange="leerImagenQR(this)">

        <button
            type="button"
            class="cargar-imagen"
            onclick="document.getElementById('archivoQR').click()">
            🖼️ Cargar imagen
        </button>

        <button
            type="button"
            class="cerrar"
            onclick="cerrarScanner()">
            ❌ Cancelar
        </button>

    </div>


    <script>

        let scannerQR = null;
        let QRProcesado = false;


        function iniciarScanner() {

            if (scannerQR) {
                return;
            }

            QRProcesado = false;

            document.getElementById(
                "lectorQR"
            ).style.display = "block";

            document.getElementById(
                "mensajeQR"
            ).innerHTML =
                "Apunte la cámara hacia el código QR.";

            scannerQR =
                new Html5Qrcode(
                    "lectorQR"
                );

            scannerQR.start(
                {
                    facingMode: "environment"
                },
                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },
                function(textoQR) {

                    if (QRProcesado) {
                        return;
                    }

                    QRProcesado = true;

                    document.getElementById(
                        "mensajeQR"
                    ).innerHTML =
                        "✅ QR detectado. Procesando...";

                    scannerQR.stop()
                        .then(function() {

                            scannerQR = null;

                            enviarQR(
                                textoQR
                            );

                        })
                        .catch(function() {

                            scannerQR = null;

                            enviarQR(
                                textoQR
                            );

                        });

                },
                function(errorMessage) {

                    // Errores normales
                    // mientras busca el QR.

                }
            )
            .catch(function(error) {

                console.error(
                    "Error iniciando cámara:",
                    error
                );

                scannerQR = null;

                document.getElementById(
                    "lectorQR"
                ).style.display = "none";

                document.getElementById(
                    "mensajeQR"
                ).innerHTML =
                    "❌ No se pudo iniciar la cámara.";

            });

        }


        function enviarQR(textoQR) {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );

            const origen =
                parametros.get("origen") ||
                "inicio";


            if (
                window.opener &&
                !window.opener.closed
            ) {

                window.opener.postMessage(
                    {
                        tipo: "QR_ESCANEADO",
                        texto: textoQR,
                        origen: origen
                    },
                    "*"
                );

                setTimeout(
                    function() {

                        window.close();

                    },
                    300
                );

            } else {

                document.getElementById(
                    "mensajeQR"
                ).innerHTML =
                    "⚠️ No se encontró la aplicación que abrió este lector.";

            }

        }


        function leerImagenQR(input) {

            const archivo =
                input.files[0];

            if (!archivo) {
                return;
            }


            if (
                !archivo.type.startsWith("image/")
            ) {

                document.getElementById(
                    "mensajeQR"
                ).innerHTML =
                    "❌ El archivo seleccionado no es una imagen.";

                input.value = "";

                return;

            }


            if (QRProcesado) {
                return;
            }

            QRProcesado = true;


            document.getElementById(
                "lectorQR"
            ).style.display = "none";


            document.getElementById(
                "mensajeQR"
            ).innerHTML =
                "⏳ Leyendo imagen...";


            const procesarImagen =
                function() {

                    const lectorImagen =
                        new Html5Qrcode(
                            "lectorQR"
                        );

                    lectorImagen
                        .scanFile(
                            archivo,
                            true
                        )
                        .then(
                            function(textoQR) {

                                lectorImagen.clear();

                                document.getElementById(
                                    "mensajeQR"
                                ).innerHTML =
                                    "✅ QR detectado. Procesando...";

                                enviarQR(
                                    textoQR
                                );

                            }
                        )
                        .catch(
                            function(error) {

                                console.error(
                                    "Error leyendo imagen QR:",
                                    error
                                );

                                lectorImagen.clear();

                                QRProcesado = false;

                                document.getElementById(
                                    "mensajeQR"
                                ).innerHTML =
                                    "❌ No se encontró un código QR en la imagen.";

                                input.value = "";

                            }
                        );

                };


            if (scannerQR) {

                scannerQR
                    .stop()
                    .then(
                        function() {

                            scannerQR = null;

                            procesarImagen();

                        }
                    )
                    .catch(
                        function() {

                            scannerQR = null;

                            procesarImagen();

                        }
                    );

            } else {

                procesarImagen();

            }

        }


        function cerrarScanner() {

            if (scannerQR) {

                scannerQR
                    .stop()
                    .catch(function() {})
                    .finally(function() {

                        scannerQR = null;

                        window.close();

                    });

            } else {

                window.close();

            }

        }

    </script>

</body>

</html>
