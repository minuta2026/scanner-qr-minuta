<script>

async function iniciarScanner() {

    if (!camaraActualId) {
        console.error("No hay cámara seleccionada");
        return;
    }

    if (scannerQR) {
        try {
            await scannerQR.stop();
        } catch (e) {
            console.warn("No se pudo detener el scanner anterior:", e);
        }

        scannerQR = null;
    }

    QRProcesado = false;

    scannerQR = new Html5Qrcode("lectorQR");

    try {

        await scannerQR.start(

            camaraActualId,

            {
                fps: 15,

                qrbox: {
                    width: 280,
                    height: 280
                },

                aspectRatio: 1.0,

                disableFlip: false
            },

            function (textoQR) {

                if (QRProcesado) {
                    return;
                }

                QRProcesado = true;

                document.getElementById("mensajeQR").innerHTML =
                    "✅ QR detectado. Procesando...";

                scannerQR.stop()
                    .then(function () {

                        scannerQR = null;

                        enviarQR(textoQR);

                    })
                    .catch(function (error) {

                        console.error(
                            "Error deteniendo cámara:",
                            error
                        );

                        scannerQR = null;

                        enviarQR(textoQR);
                    });
            },

            function (errorMessage) {
                // Error normal mientras busca el QR
            }
        );

        // Intentar mejorar el enfoque
        try {

            const video = document.querySelector(
                "#lectorQR video"
            );

            if (video) {

                video.setAttribute("autoplay", "");
                video.setAttribute("playsinline", "");
                video.setAttribute("muted", "");

                const track =
                    video.srcObject &&
                    video.srcObject.getVideoTracks()[0];

                if (track && track.getCapabilities) {

                    const capabilities =
                        track.getCapabilities();

                    console.log(
                        "Capacidades cámara:",
                        capabilities
                    );

                    if (
                        capabilities.focusMode &&
                        capabilities.focusMode.includes("continuous")
                    ) {

                        await track.applyConstraints({
                            advanced: [
                                {
                                    focusMode: "continuous"
                                }
                            ]
                        });

                        console.log(
                            "✅ Autofocus continuo activado"
                        );
                    }
                }
            }

        } catch (error) {

            console.warn(
                "No se pudo configurar el autofocus:",
                error
            );
        }

        document.getElementById(
            "mensajeQR"
        ).innerHTML =
            "📷 Cámara lista. Enfoca el código QR";

    } catch (error) {

        console.error(
            "Error iniciando cámara:",
            error
        );

        scannerQR = null;

        document.getElementById(
            "mensajeQR"
        ).innerHTML =
            "❌ No se pudo iniciar esta cámara.";
    }
}

</script>
