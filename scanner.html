<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1">

<title>Escanear QR</title>

<script
    src="https://unpkg.com/html5-qrcode">
</script>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 20px;

    background: #eef2f7;

    font-family: Arial, sans-serif;

    text-align: center;

    color: #333;

}


/* =====================================================
   TITULO
===================================================== */

h2 {

    margin-top: 10px;

    margin-bottom: 15px;

    color: #0b3d91;

}


/* =====================================================
   SELECTOR DE CÁMARA
===================================================== */

#contenedorCamara {

    width: 100%;

    max-width: 600px;

    margin: 15px auto;

    text-align: left;

}


#contenedorCamara label {

    display: block;

    margin-bottom: 6px;

    font-weight: bold;

    color: #333;

}


#selectorCamara {

    width: 100%;

    padding: 12px;

    border: 1px solid #bbb;

    border-radius: 8px;

    background: white;

    font-size: 15px;

    cursor: pointer;

}


#selectorCamara:focus {

    outline: 2px solid #0b3d91;

}


/* =====================================================
   INFORMACIÓN DE CÁMARA
===================================================== */

#camaraActual {

    margin-top: 10px;

    padding: 10px;

    background: #e8f0fe;

    border-radius: 8px;

    color: #0b3d91;

    font-size: 14px;

    text-align: center;

}


/* =====================================================
   CONTENEDOR DEL LECTOR
===================================================== */

#contenedorLector {

    width: 100%;

    max-width: 600px;

    margin: 20px auto;

    position: relative;

    background: #111;

    border-radius: 16px;

    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

}


/* =====================================================
   LECTOR QR
===================================================== */

#lectorQR {

    width: 100%;

    background: #000;

    min-height: 320px;

}


/*
   La biblioteca genera internamente
   el elemento de video.
*/

#lectorQR video {

    width: 100% !important;

    height: auto !important;

    display: block;

    object-fit: cover;

}


/* =====================================================
   MARCO VISUAL DEL QR
===================================================== */

.marcoQR {

    position: absolute;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    width: 70%;

    max-width: 350px;

    aspect-ratio: 1 / 1;

    pointer-events: none;

    z-index: 10;

}


/* Esquinas del marco */

.marcoQR::before,
.marcoQR::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 12px;

}


/*
   Marco principal
*/

.marcoQR {

    border: 3px solid rgba(255,255,255,.9);

    box-shadow:

        0 0 0 9999px rgba(0,0,0,.18),

        0 0 20px rgba(255,255,255,.35);

}


/* =====================================================
   LÍNEA DE ESCANEO
===================================================== */

.lineaEscaneo {

    position: absolute;

    left: 8%;

    right: 8%;

    height: 3px;

    top: 10%;

    background: #00ff66;

    box-shadow:

        0 0 8px #00ff66,

        0 0 15px #00ff66;

    animation: escanear 2s linear infinite;

}


@keyframes escanear {

    0% {

        top: 8%;

    }

    50% {

        top: 92%;

    }

    100% {

        top: 8%;

    }

}


/* =====================================================
   INDICACIÓN
===================================================== */

.indicacionQR {

    position: absolute;

    bottom: 12px;

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    padding: 8px 12px;

    background: rgba(0,0,0,.65);

    color: white;

    border-radius: 20px;

    font-size: 14px;

    z-index: 11;

}


/* =====================================================
   MENSAJE
===================================================== */

#mensajeQR {

    max-width: 600px;

    margin: 15px auto;

    padding: 10px;

    font-size: 16px;

    color: #555;

    font-weight: 500;

}


/* =====================================================
   BOTÓN CANCELAR
===================================================== */

.cerrar {

    margin-top: 10px;

    padding: 12px 25px;

    border: none;

    border-radius: 8px;

    background: #d32f2f;

    color: white;

    font-size: 16px;

    cursor: pointer;

}


.cerrar:hover {

    opacity: .9;

}


.cerrar:active {

    transform: scale(.97);

}


/* =====================================================
   BOTÓN CAMBIAR
===================================================== */

#botonCambiar {

    margin-top: 10px;

    padding: 10px 20px;

    border: none;

    border-radius: 8px;

    background: #0b3d91;

    color: white;

    font-size: 15px;

    cursor: pointer;

    display: none;

}


#botonCambiar:hover {

    opacity: .9;

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 10px;

    }


    h2 {

        font-size: 21px;

        margin-top: 5px;

    }


    #contenedorCamara {

        margin-top: 10px;

    }


    #contenedorLector {

        margin-top: 15px;

        border-radius: 12px;

    }


    #lectorQR {

        min-height: 300px;

    }


    .marcoQR {

        width: 76%;

        max-width: 320px;

        border-width: 3px;

    }


    .indicacionQR {

        font-size: 13px;

        bottom: 8px;

    }


    #mensajeQR {

        font-size: 15px;

    }


    .cerrar {

        width: 90%;

        max-width: 300px;

    }

}


/* =====================================================
   PANTALLAS MUY PEQUEÑAS
===================================================== */

@media (max-width: 380px) {

    body {

        padding: 8px;

    }


    h2 {

        font-size: 19px;

    }


    #lectorQR {

        min-height: 270px;

    }


    .marcoQR {

        width: 78%;

    }

}

</style>

</head>

<body>

<h2>📷 Escanear código QR</h2>

<!-- =================================
     SELECTOR DE CÁMARA
================================== -->

<div id="contenedorCamara">

```
<label for="selectorCamara">

    📷 Seleccionar cámara

</label>


<select
    id="selectorCamara"
    disabled>

    <option>

        Detectando cámaras...

    </option>

</select>


<div id="camaraActual">

    📷 Cámara: Detectando...

</div>
```

</div>

<!-- =================================
     LECTOR
================================== -->

<div id="contenedorLector">

```
<div id="lectorQR"></div>


<!-- Marco visual -->

<div class="marcoQR">

    <div class="lineaEscaneo"></div>

</div>


<!-- Instrucción -->

<div class="indicacionQR">

    📱 Coloca el código QR dentro del marco

</div>
```

</div>

<!-- =================================
     MENSAJE
================================== -->

<div id="mensajeQR">

```
Preparando cámara...
```

</div>

<!-- =================================
     BOTÓN CANCELAR
================================== -->

<button
 type="button"
 class="cerrar"
 onclick="cerrarScanner()">

```
❌ Cancelar
```

</button>

<script>


/* =====================================================
   VARIABLES
===================================================== */

let scannerQR = null;

let QRProcesado = false;

let camarasDisponibles = [];

let camaraActualId = null;


/* =====================================================
   OBTENER CÁMARAS
===================================================== */

async function obtenerCamaras() {

    try {

        /*
         * Primero solicitamos permiso.
         */

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: true

            });


        /*
         * Cerramos inmediatamente
         * el stream.
         */

        stream.getTracks().forEach(function(track) {

            track.stop();

        });


        /*
         * Obtenemos todas las cámaras.
         */

        const dispositivos =
            await Html5Qrcode.getCameras();


        if (
            !dispositivos ||
            dispositivos.length === 0
        ) {

            throw new Error(
                "No se encontraron cámaras."
            );

        }


        camarasDisponibles =
            dispositivos;


        const selector =
            document.getElementById(
                "selectorCamara"
            );


        /*
         * Limpiar selector.
         */

        selector.innerHTML = "";


        /*
         * Agregar cámaras.
         */

        dispositivos.forEach(
            function(camara, indice) {

                const opcion =
                    document.createElement(
                        "option"
                    );


                opcion.value =
                    camara.id;


                let nombre =
                    camara.label;


                if (
                    !nombre ||
                    nombre.trim() === ""
                ) {

                    nombre =
                        "Cámara " +
                        (indice + 1);

                }


                opcion.textContent =
                    "📷 " + nombre;


                selector.appendChild(
                    opcion
                );

            }
        );


        selector.disabled = false;


        /*
         * Buscar cámara trasera.
         */

        let indiceTrasera = -1;


        dispositivos.forEach(
            function(camara, indice) {

                const nombre =
                    (
                        camara.label ||
                        ""
                    ).toLowerCase();


                if (
                    indiceTrasera === -1 &&
                    (
                        nombre.includes("back") ||
                        nombre.includes("rear") ||
                        nombre.includes("trasera") ||
                        nombre.includes("environment")
                    )
                ) {

                    indiceTrasera =
                        indice;

                }

            }
        );


        /*
         * Seleccionar cámara.
         */

        if (indiceTrasera >= 0) {

            camaraActualId =
                dispositivos[
                    indiceTrasera
                ].id;

        }
        else {

            camaraActualId =
                dispositivos[0].id;

        }


        selector.value =
            camaraActualId;


        actualizarNombreCamara();


        /*
         * Iniciar cámara.
         */

        iniciarScanner();


    }

    catch (error) {

        console.error(
            "Error obteniendo cámaras:",
            error
        );


        document.getElementById(
            "mensajeQR"
        ).innerHTML =

            "❌ No se pudieron obtener las cámaras. " +
            "Verifique que haya concedido permiso para utilizar la cámara.";

    }

}


/* =====================================================
   MOSTRAR CÁMARA ACTUAL
===================================================== */

function actualizarNombreCamara() {

    const elemento =
        document.getElementById(
            "camaraActual"
        );


    const camara =
        camarasDisponibles.find(
            function(c) {

                return (
                    c.id ===
                    camaraActualId
                );

            }
        );


    if (!camara) {

        elemento.innerHTML =
            "📷 Cámara: No identificada";

        return;

    }


    let nombre =
        camara.label;


    if (
        !nombre ||
        nombre.trim() === ""
    ) {

        nombre =
            "Cámara seleccionada";

    }


    elemento.innerHTML =

        "📷 <strong>Cámara utilizada:</strong> " +
        nombre;

}


/* =====================================================
   INICIAR SCANNER
===================================================== */

function iniciarScanner() {


    /*
     * Si ya existe un lector,
     * no crear otro.
     */

    if (scannerQR) {

        return;

    }


    QRProcesado = false;


    scannerQR =
        new Html5Qrcode(
            "lectorQR"
        );


    /*
     * Configuración de cámara.
     *
     * Se solicita una resolución
     * más adecuada para QR.
     */

    const configuracion = {

        fps: 15,


        /*
         * Área de lectura dinámica.
         *
         * Se adapta al tamaño
         * de la pantalla.
         */

        qrbox: function(
            viewfinderWidth,
            viewfinderHeight
        ) {

            let tamaño =
                Math.min(
                    viewfinderWidth,
                    viewfinderHeight
                ) * 0.75;


            /*
             * Evitar que sea
             * demasiado pequeño.
             */

            tamaño =
                Math.max(
                    tamaño,
                    220
                );


            /*
             * Evitar que sea
             * excesivamente grande.
             */

            tamaño =
                Math.min(
                    tamaño,
                    420
                );


            return {

                width:
                    Math.floor(tamaño),

                height:
                    Math.floor(tamaño)

            };

        },


        /*
         * Relación de aspecto
         * cuadrada.
         */

        aspectRatio: 1.0,


        /*
         * Intentar mantener
         * una resolución alta.
         */

        videoConstraints: {

            width: {
                ideal: 1920
            },

            height: {
                ideal: 1080
            },

            facingMode: {
                ideal: "environment"
            }

        }

    };


    scannerQR.start(

        camaraActualId,

        configuracion,


        function(textoQR) {


            /*
             * Evitar que el mismo QR
             * sea procesado varias veces.
             */

            if (QRProcesado) {

                return;

            }


            QRProcesado = true;


            document.getElementById(
                "mensajeQR"
            ).innerHTML =

                "✅ QR detectado. Procesando...";


            /*
             * Detener cámara.
             */

            scannerQR
                .stop()

                .then(function() {

                    scannerQR = null;


                    enviarQR(
                        textoQR
                    );

                })


                .catch(function(error) {

                    console.error(
                        "Error deteniendo cámara:",
                        error
                    );


                    scannerQR = null;


                    enviarQR(
                        textoQR
                    );

                });

        },


        function(errorMessage) {

            /*
             * Errores normales mientras
             * busca el QR.
             *
             * No mostramos estos errores.
             */

        }

    )


    .catch(function(error) {


        console.error(
            "Error iniciando cámara:",
            error
        );


        scannerQR = null;


        document.getElementById(
            "mensajeQR"
        ).innerHTML =

            "❌ No se pudo iniciar esta cámara.";

    });

}


/* =====================================================
   CAMBIAR DE CÁMARA
===================================================== */

async function cambiarCamara() {


    const selector =
        document.getElementById(
            "selectorCamara"
        );


    const nuevoId =
        selector.value;


    if (!nuevoId) {

        return;

    }


    /*
     * Si es la misma cámara,
     * no hacemos nada.
     */

    if (
        nuevoId ===
        camaraActualId
    ) {

        return;

    }


    document.getElementById(
        "mensajeQR"
    ).innerHTML =

        "🔄 Cambiando de cámara...";


    /*
     * Evitar procesar QR
     * durante el cambio.
     */

    QRProcesado = true;


    /*
     * Detener cámara actual.
     */

    if (scannerQR) {

        try {

            await scannerQR.stop();

        }

        catch (error) {

            console.warn(
                "No se pudo detener correctamente:",
                error
            );

        }


        scannerQR = null;

    }


    /*
     * Cambiar ID.
     */

    camaraActualId =
        nuevoId;


    actualizarNombreCamara();


    /*
     * Reiniciar detección.
     */

    QRProcesado = false;


    iniciarScanner();

}


/* =====================================================
   ENVIAR QR A APP SCRIPT
===================================================== */

function enviarQR(textoQR) {


    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const origen =
        parametros.get("origen") ||
        "inicio";


    /*
     * Verificar ventana
     * que abrió el escáner.
     */

    if (
        window.opener &&
        !window.opener.closed
    ) {


        window.opener.postMessage(

            {

                tipo:
                    "QR_ESCANEADO",

                texto:
                    textoQR,

                origen:
                    origen

            },

            "*"

        );


        /*
         * Cerrar lector.
         */

        setTimeout(

            function() {

                window.close();

            },

            300

        );


    }

    else {


        document.getElementById(
            "mensajeQR"
        ).innerHTML =

            "⚠️ No se encontró la aplicación " +
            "que abrió este lector.";

    }

}


/* =====================================================
   CERRAR SCANNER
===================================================== */

async function cerrarScanner() {


    if (scannerQR) {


        try {

            await scannerQR.stop();

        }

        catch (error) {

            console.warn(
                "Error cerrando cámara:",
                error
            );

        }


        scannerQR = null;

    }


    window.close();

}


/* =====================================================
   CAMBIO DEL SELECTOR
===================================================== */

document.getElementById(
    "selectorCamara"
).addEventListener(

    "change",

    function() {

        cambiarCamara();

    }

);


/* =====================================================
   INICIAR AL CARGAR
===================================================== */

window.addEventListener(

    "load",

    function() {

        obtenerCamaras();

    }

);

</script>

</body>

</html>
